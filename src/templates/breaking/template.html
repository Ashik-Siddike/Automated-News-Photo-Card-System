<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>PhotoCard - Breaking</title>
  <link rel="stylesheet" href="../styles/common.css">
  <style>
    .breaking-card {
      padding: 48px;
    }

    .top-header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      background: #dc2626;
      color: #ffffff;
      padding: 8px 18px;
      font-size: 19px;
      font-weight: 800;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .category-badge {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
    }

    .source-box {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .source-icon {
      font-size: 18px;
    }

    /* Content Section */
    .bottom-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .date-stamp {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-size: 18px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 8px;
      width: fit-content;
    }

    .headline {
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 52px;
      font-weight: 800;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8), 0 2px 4px rgba(0,0,0,0.9);
      letter-spacing: -0.3px;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .summary-box {
      font-size: 24px;
      font-weight: 500;
      line-height: 1.45;
      color: #e2e8f0;
      border-left: 5px solid #ef4444;
      padding-left: 18px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 10px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .branding-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .verified-mark {
      color: #38bdf8;
      font-size: 18px;
    }

    .brand-tagline {
      font-size: 15px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card-container {{aspectRatioClass}} breaking-card">
    <!-- Hero Image Background -->
    <img class="bg-image" src="{{imageUrl}}" alt="News Image" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=1200&q=80'">
    <div class="gradient-overlay"></div>

    <!-- Header -->
    <div class="top-header">
      <div class="badge-group">
        <div class="live-badge">
          <span class="live-dot"></span>
          <span>ব্রেকিং নিউজ</span>
        </div>
        <div class="category-badge">{{category}}</div>
      </div>
      <div class="source-box">
        <span class="source-icon">📰</span>
        <span>{{source}}</span>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="bottom-section">
      <div class="date-stamp">
        <span>🕒</span>
        <span>{{date}}</span>
      </div>

      <h1 class="headline">{{title}}</h1>

      {{#summary}}
      <div class="summary-box">
        {{summary}}
      </div>
      {{/summary}}

      <!-- Footer Bar with QR and Branding -->
      <div class="footer-bar">
        <div class="branding-group">
          <div class="brand-name">
            {{brandName}} <span class="verified-mark">✓</span>
          </div>
          <div class="brand-tagline">{{brandTagline}}</div>
        </div>

        <!-- Dynamic QR Code -->
        <div class="qr-badge-container">
          <img class="qr-code-img" src="{{qrCodeDataUrl}}" alt="QR Code">
          <div class="qr-text-group">
            <div class="qr-label-title">স্ক্যান করে পড়ুন</div>
            <div class="qr-label-subtitle">মূল খবরের লিঙ্ক</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Accent Line -->
    <div class="accent-bar"></div>
  </div>
</body>
</html>
