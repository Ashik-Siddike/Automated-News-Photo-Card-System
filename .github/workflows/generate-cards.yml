name: Automated BD News PhotoCard Generator

on:
  schedule:
    # Runs every 30 minutes, 24/7 (UTC time)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI

jobs:
  generate:
    name: Crawl News & Generate Photo Cards
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit cards back to repository

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔤 Install Bengali Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-beng fonts-noto-core fonts-freefont-ttf

      - name: 📦 Install npm dependencies
        run: |
          npm install

      - name: 🔨 Build TypeScript
        run: |
          npm run build

      - name: 🚀 Run PhotoCard Generation Pipeline
        env:
          NODE_OPTIONS: '--dns-result-order=ipv4first'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}
          MAX_CARDS_PER_RUN: 3
          TEMPLATE_STYLE: 'breaking'
          CARD_ASPECT_RATIO: 'square'
        run: |
          node dist/index.js

      - name: 💾 Commit & Push generated cards and cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "PhotoCard Bot"
          git add output/ data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate photo cards [skip ci]" && git push)
        continue-on-error: true

      - name: 📦 Upload Generated Cards as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-photo-cards
          path: output/
          retention-days: 7
